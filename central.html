<script>
window.openLoginForm = function(msg){
  sessionStorage.removeItem('rondaspro_api_token');
  try{localStorage.removeItem('rondaspro_android_token');}catch(e){}
  const r = document.querySelector('#central-root');
  if(r){
    r.innerHTML = '<form id="central-login" class="login"><h1>Acessar a Central</h1><p>Grupo Maxvel · Use seu usuário ou e-mail e sua senha individual. O perfil é definido pela conta.</p><details><summary>Orientações por perfil</summary><p>Ronda executa pontos; Vistoriador registra checklist e evidências; COI monitora e despacha; Cliente acompanha seu local; Administração e Master gerenciam setores e equipe. Em caso de recusa, confira o usuário e peça à Administração a revisão do cadastro.</p></details>'+
      (msg ? '<p class="flag">'+msg+'</p>' : '') +
      '<label>Usuário ou e-mail<input name="email" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>'+
      '<label>Senha<input type="password" name="password" autocomplete="current-password" required minlength="10"></label>'+
      '<button class="primary" type="submit">Entrar</button></form>';
  }
};

window.handleCentralLoginSubmit = async function(form){
  const emailInput = form.querySelector('[name=email]');
  const passInput = form.querySelector('[name=password]');
  const submitBtn = form.querySelector('button.primary') || form.querySelector('button');
  if(!emailInput || !passInput) return;
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Entrando…'; }
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: emailInput.value.trim(), password: passInput.value})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || data.message || 'Credenciais inválidas.');
    sessionStorage.setItem('rondaspro_api_token', data.token);
    try { localStorage.setItem('rondaspro_android_token', data.token); } catch(e){}
    location.reload();
  } catch(err) {
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Entrar'; }
    let flag = form.querySelector('.flag');
    if(!flag){
      flag = document.createElement('p');
      flag.className = 'flag';
      const label = form.querySelector('label');
      if(label) form.insertBefore(flag, label);
      else form.appendChild(flag);
    }
    flag.textContent = err.message || 'Falha no acesso.';
  }
};

document.addEventListener('submit', function(e){
  if(e.target && e.target.id === 'central-login' && !window.__centralJsReady){
    e.preventDefault();
    window.handleCentralLoginSubmit(e.target);
  }
});
</script>
