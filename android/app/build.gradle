plugins { id 'com.android.application' }

android {
    namespace 'br.com.horizon.maxvel'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.horizon.maxvel'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.0.0-native'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.maplibre.gl:android-sdk:13.6.1'
}

// Interface, navegação, sensores e rastreamento usam SDK e serviços Android nativos.
