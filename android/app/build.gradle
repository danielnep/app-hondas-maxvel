plugins { id 'com.android.application' }

android {
    namespace 'br.com.horizon.maxvel'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.horizon.maxvel'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.assets.srcDirs "$buildDir/generated/web-assets"
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// A web view e o repositório usam a MESMA fonte: sem duplicar arquivos manualmente.
tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'central.html', 'src/**', 'assets/**'
    }
    into "$buildDir/generated/web-assets/site"
}
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) {
        dependsOn(tasks.named('syncWebAssets'))
    }
}