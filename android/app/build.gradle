plugins { id 'com.android.application' }

android {
    namespace 'br.com.horizon.maxvel'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.horizon.maxvel'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '2.1.4-glass-presence'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += [layout.buildDirectory.dir('generated/rondaFrontend')]
}

tasks.register('embedGlassFrontend', Copy) {
    from(file('../..')) {
        include 'index.html', 'central.html', 'manifest.webmanifest', 'src/**', 'assets/**'
        exclude '**/*.map'
    }
    into(layout.buildDirectory.dir('generated/rondaFrontend/app'))
    doLast {
        def output = layout.buildDirectory.dir('generated/rondaFrontend/app').get().asFile
        ['index.html','central.html'].each { filename ->
            def page = new File(output, filename)
            def html = page.getText('UTF-8')
                .replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', './assets/vendor/leaflet/leaflet.css')
                .replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', './assets/vendor/leaflet/leaflet.js')
                .replace('if("serviceWorker" in navigator&&location.protocol==="https:"', 'if(!window.__RONDA_ANDROID_BUNDLE__&&"serviceWorker" in navigator&&location.protocol==="https:"')
            html = html.replace('</head>','<script src="./src/native-boot.js"></script></head>')
            page.setText(html, 'UTF-8')
        }
        def map = new File(output,'src/map.js')
        map.setText(map.getText('UTF-8').replace('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','./assets/vendor/leaflet/leaflet.js'),'UTF-8')
    }
}
preBuild.dependsOn(tasks.named('embedGlassFrontend'))
