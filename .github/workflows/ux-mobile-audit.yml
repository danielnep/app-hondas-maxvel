name: Auditoria UI UX mobile
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ux-mobile-audit.mjs'
      - 'src/app.js'
      - 'src/map.js'
      - 'assets/horizon-operacional.css'
      - 'assets/horizon-graphite.css'
      - 'src/tutorial.js'
      - 'src/scheduling.js'
      - 'index.html'
      - 'styles/**'
      - 'styles.css'
      - 'assets/ronda-pro*.css'
      - 'assets/maxvel-logo.webp'
      - '.github/workflows/ux-mobile-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Playwright Core
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Verificar navegador
        run: command -v chromium || command -v google-chrome || command -v chromium-browser
      - name: Executar fluxos em 8 larguras
        run: node scripts/ux-mobile-audit.mjs
      - name: Publicar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxvel-ux-mobile-stage2
          path: artifacts/mobile-ux/
          if-no-files-found: warn
