name: Ronda Pro · Glass UI responsiva
on:
  pull_request:
    paths:
      - 'assets/theme.css'
      - 'assets/ronda-pro.css'
      - 'src/live-client.js'
      - 'index.html'
      - 'scripts/visual-entry-review.mjs'
      - 'src/central.js'
      - 'scripts/responsive-management-review.mjs'
      - 'scripts/field-drawer-cross-interaction.mjs'
      - 'src/theme-shell.js'
      - 'src/internal-chat-ui.js'
      - 'tests/glass-responsive-management.test.mjs'
      - '.github/workflows/glass-responsive.yml'
  workflow_dispatch:
  push:
    branches: [feat/glass-responsive-management-20261020, fix/field-drawers-motion-20261020]

permissions:
  contents: read

jobs:
  responsive-management:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser controller and project CSS parser
        run: npm install --no-save --no-package-lock playwright-core@1.56.1 postcss@8.5.30
      - name: Syntax and canonical CSS checks
        run: |
          npm run check
          npm run check:styles
          node --check scripts/responsive-management-review.mjs
          node --check scripts/field-drawer-cross-interaction.mjs
          node --check scripts/visual-entry-review.mjs
      - name: Responsive CSS regressions
        run: node --test tests/glass-responsive-management.test.mjs
      - name: Real user URL entry review at six viewport widths
        run: node scripts/visual-entry-review.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Authenticated real Chromium journeys at 320/360/393/768/1024/1440
        run: node scripts/responsive-management-review.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Field drawers, message equivalence, open-close, edge handle (real Chromium)
        run: node scripts/field-drawer-cross-interaction.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Upload field interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronda-field-drawer-evidence
          path: artifacts/field-drawer-cross-interaction/
          if-no-files-found: warn
      - name: Upload actual-site login screenshots and geometric review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronda-visual-entry-evidence
          path: artifacts/visual-entry-review/
          if-no-files-found: warn
      - name: Upload mobile and desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ronda-glass-responsive-evidence
          path: artifacts/responsive-management/
          if-no-files-found: warn
