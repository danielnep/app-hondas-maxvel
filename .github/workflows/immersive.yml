name: Experiencia real do app simulada
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, maxvel-06-ux-mobile]
    paths:
      - 'scripts/app-immersive-test.mjs'
      - 'scripts/coi-central-smoke.mjs'
      - 'scripts/coi-demo-smoke.mjs'
      - 'src/coi-monitor.js'
      - 'src/central.js'
      - 'assets/coi-operations-v3.css'
      - 'assets/uiux-refinement.css'
      - 'src/dialog-pagination.js'
      - 'src/app.js'
      - 'assets/horizon-operacional.css'
      - 'assets/horizon-graphite.css'
      - 'src/tutorial.js'
      - 'src/scheduling.js'
      - 'index.html'
      - '.github/workflows/immersive.yml'

permissions:
  contents: read

jobs:
  real-app-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar controlador de navegador
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Conferir desenho real do mapa de vistoria com 1 e 3 destinos
        run: node scripts/inspection-map-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Validar abertura de tratativas no COI demonstrativo
        run: node scripts/coi-demo-smoke.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Guardar prévia visual da revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxvel-uiux-preview
          path: artifacts/uiux-refinement/
          if-no-files-found: warn
      - name: Executar fluxos do próprio app em sete tamanhos
        run: node scripts/app-immersive-test.mjs
      - name: Validar COI autenticado (mobile e desktop)
        run: node scripts/coi-central-smoke.mjs
      - name: Guardar capturas e medidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxvel-app-immersive-ux
          path: |
            artifacts/app-immersive/
            artifacts/coi-authenticated/
            artifacts/uiux-refinement/
          if-no-files-found: warn
