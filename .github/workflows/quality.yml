name: Validação Hondas Maxvel
on:
  push:
    branches: [main, maxvel-06-ux-mobile]
  pull_request:
  workflow_dispatch:

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxe
        run: npm run check
      - name: Testes de domínio e interface
        run: npm test
      - name: Abertura real em Chromium
        run: bash scripts/browser-smoke.sh
      - name: Capturas da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxvel-browser-captures
          path: artifacts/
          if-no-files-found: ignore

  mobile-messages-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Preparar controlador Chromium
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Testar abertura, envio e fechamento do painel mobile
        run: CHROME_BIN=$(command -v google-chrome || command -v chromium) node scripts/mobile-messages-smoke.mjs
