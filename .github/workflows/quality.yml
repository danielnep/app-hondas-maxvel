name: Validação Hondas Maxvel
on:
  push:
    branches: [main, maxvel-06-ux-mobile]
  pull_request:
  workflow_dispatch:

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxe
        run: npm run check
      - name: Testes de domínio e interface
        run: npm test
      - name: Abertura real em Chromium
        run: bash scripts/browser-smoke.sh
      - name: Capturas da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxvel-browser-captures
          path: artifacts/
          if-no-files-found: ignore
