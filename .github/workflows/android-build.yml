name: Ronda Pro Maxvel | APK operacional de teste
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'central.html'
      - 'central.html'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main, maxvel-06-ux-mobile]
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar SDK Android pré-instalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Instalar Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar app debug
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ronda-pro-maxvel-piloto-1.1.0
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
