<script>
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.host.includes("appassets.androidplatform.net")){
  const updateKey="rondas-pro-updated-v95";
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(sessionStorage.getItem(updateKey))return;
    sessionStorage.setItem(updateKey,"1");
    let roundActive=false;
    try{const saved=JSON.parse(localStorage.getItem("horizon-maxvel-v1")||"null");roundActive=!!saved?.activeSessionId;}catch{}
    if(!roundActive)location.reload();
    else{
      const notice=document.createElement("div");
      notice.setAttribute("role","status");
      notice.style.cssText="position:fixed;left:14px;right:14px;bottom:16px;z-index:999999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #cc243b;border-radius:12px;background:#09090bf2;color:#fff;box-shadow:0 12px 36px #000a";
      notice.innerHTML="<span>Nova versão pronta. Atualize após terminar a ronda.</span><button type='button' style='padding:9px 12px;background:#e5232a;color:#ffffff;border:0;border-radius:8px;font-weight:700;'>Atualizar</button>";
      notice.querySelector("button").addEventListener("click",()=>location.reload());
      document.body.append(notice);
    }
  });
  navigator.serviceWorker.register("./sw.js?v=95",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{});
}
</script>
