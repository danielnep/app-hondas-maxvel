<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#050505"><meta name="description" content="Grupo Maxvel: acompanhamento de rondas, supervisão e gestão operacional.">
 <title>Ronda Pro · Grupo Maxvel | Acompanhamento Operacional</title>
 <link rel="preconnect" href="https://tile.openstreetmap.org"><link rel="preconnect" href="https://unpkg.com">
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
 <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/webp" href="./assets/maxvel-logo.webp"><link rel="apple-touch-icon" href="./assets/maxvel-logo.webp">

<link rel="stylesheet" href="./assets/ronda-pro.css?v=52">
<link rel="stylesheet" href="./assets/operational.css?v=52">
<link rel="stylesheet" href="./assets/mobile-critical.css?v=50">
<link rel="stylesheet" href="./assets/field.css?v=51">
<link rel="stylesheet" href="./assets/theme.css?v=62">
</head>
<body class="rp-theme">
 <a href="#main" class="skip-link">Ir para o conteúdo</a>
 <div id="app"><div class="boot"><img src="./assets/maxvel-logo.webp" width="180" height="56" alt="Maxvel"><strong>Ronda Pro</strong><span>Preparando o ambiente operacional…</span></div></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <dialog id="dialog" aria-label="Janela de informações"></dialog>
 <script type="module" src="./src/app.js?v=77"></script>
 <script type="module" src="./src/inspection-demo-camera.js?v=1"></script>
 <script type="module" src="./src/soft-polish.js?v=1"></script>
<script>
if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.host.includes("appassets.androidplatform.net")){
  const updateKey="rondas-pro-updated-v74";
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(sessionStorage.getItem(updateKey))return;
    sessionStorage.setItem(updateKey,"1");
    let roundActive=false;
    try{const saved=JSON.parse(localStorage.getItem("horizon-maxvel-v1")||"null");roundActive=!!saved?.activeSessionId;}catch{}
    if(!roundActive)location.reload();
    else{
      const notice=document.createElement("div");
      notice.setAttribute("role","status");
      notice.style.cssText="position:fixed;left:14px;right:14px;bottom:16px;z-index:999999;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid #38bdf8;border-radius:12px;background:#09090bf2;color:#fff;box-shadow:0 12px 36px #000a";
      notice.innerHTML="<span>Nova versão pronta. Atualize após terminar a ronda.</span><button type='button' style='padding:9px 12px;background:#e7edf5;color:#151b22;border:0;border-radius:8px'>Atualizar</button>";
      notice.querySelector("button").addEventListener("click",()=>location.reload());
      document.body.append(notice);
    }
  });
  navigator.serviceWorker.register("./sw.js?v=74",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{});
}
</script>
</body>
</html>
